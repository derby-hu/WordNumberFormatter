<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>千分符格式化工具</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: "Segoe UI", sans-serif; padding: 16px; }
        h1 { font-size: 18px; margin-bottom: 8px; }
        p { font-size: 13px; color: #555; line-height: 1.5; }
        button {
            display: block; width: 100%; margin-top: 8px;
            padding: 8px 16px; font-size: 14px;
            background: #0078d4; color: #fff; border: none;
            border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #106ebe; }
        #status { margin-top: 12px; font-size: 13px; color: #333; }
    </style>
</head>
<body>
    <h1>千分符格式化工具</h1>
    <!-- 修正：原误写 ">= 3 位"，实际逻辑要求整数 >= 4 位（与 SEARCH_PATTERN {4,} 一致） -->
    <p>为文档中所有"整数部分 ≥ 4 位、小数恰好 2 位"的数字添加千分符。</p>
    <button id="format-body">文档替换</button>
    <button id="format-table">表格替换</button>
    <div id="status"></div>
    <!-- 修正：移除 <script src="../shared/number-formatter.js"> 与 <script src="taskpane.js">
         这两个本地脚本由 webpack 打包、HtmlWebpackPlugin 自动注入；手动引用会 404 -->
</body>
</html>
